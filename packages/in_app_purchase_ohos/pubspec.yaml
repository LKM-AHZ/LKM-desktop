name: in_app_purchase_ohos
version: 1.1.0
publish_to: none
description: Current shared in_app_purchase interface backed by HarmonyOS IAP Kit.
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  in_app_purchase_platform_interface: ^1.4.1
flutter:
  licenses: [LICENSE-OHOS]
  plugin:
    implements: in_app_purchase
    platforms:
      ohos:
        # Native IAP is gated off until AGC products and server-side receipt
        # verification exist; only the Dart platform implementation registers.
        dartPluginClass: InAppPurchaseOhosPlatform
